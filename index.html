<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="A modern, responsive, and interactive Tic Tac Toe web game with Player vs Player and Player vs Computer modes featuring Minimax AI.">
  <meta name="theme-color" content="#0a0e17">
  <title>Tic Tac Toe — Modern Web Game</title>
  
  <!-- Google Fonts: Outfit for sleek modern gaming typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-cyan" aria-hidden="true"></div>
  <div class="ambient-glow glow-pink" aria-hidden="true"></div>
  
  <main class="app-container">
    <!-- Header Section -->
    <header class="game-header">
      <div class="logo-badge">
        <span class="badge-dot" aria-hidden="true"></span>
        <span class="badge-text">Web Edition</span>
      </div>
      <h1 class="game-title">
        <span class="title-accent-x">TIC</span>
        <span class="title-divider">·</span>
        <span class="title-accent-mid">TAC</span>
        <span class="title-divider">·</span>
        <span class="title-accent-o">TOE</span>
      </h1>
      <p class="subtitle">A classic game. A fresh experience.</p>
    </header>

    <!-- Game Mode Selector -->
    <section class="mode-section" aria-label="Game Mode Options">
      <div class="segmented-control" role="tablist" aria-label="Select Game Mode">
        <button 
          type="button" 
          id="modePvpBtn" 
          class="segment-btn active" 
          role="tab" 
          aria-selected="true" 
          aria-controls="pvpPanel"
          data-mode="pvp"
        >
          <svg class="segment-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>2 Players</span>
        </button>

        <button 
          type="button" 
          id="modePvcBtn" 
          class="segment-btn" 
          role="tab" 
          aria-selected="false" 
          aria-controls="pvcPanel"
          data-mode="pvc"
        >
          <svg class="segment-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
            <line x1="8" y1="16" x2="8" y2="16"></line>
            <line x1="16" y1="16" x2="16" y2="16"></line>
          </svg>
          <span>vs Computer</span>
        </button>
      </div>

      <!-- Difficulty Selector (Visible only in Computer mode) -->
      <div id="difficultyContainer" class="difficulty-wrapper hidden" aria-hidden="true">
        <label for="difficultyGroup" class="difficulty-label">AI Difficulty:</label>
        <div id="difficultyGroup" class="difficulty-group" role="radiogroup" aria-label="AI Difficulty Level">
          <button type="button" class="diff-btn" role="radio" aria-checked="false" data-difficulty="easy">
            Easy
          </button>
          <button type="button" class="diff-btn" role="radio" aria-checked="false" data-difficulty="medium">
            Medium
          </button>
          <button type="button" class="diff-btn active" role="radio" aria-checked="true" data-difficulty="hard">
            Hard <span class="diff-badge">Minimax</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Player Information & Turn Status Banner -->
    <section class="turn-section" aria-label="Game Turn Status">
      <div id="statusCard" class="status-card turn-x" aria-live="polite">
        <div class="turn-indicator">
          <div class="turn-symbol-badge" id="turnSymbolBadge" aria-hidden="true">
            <!-- Dynamic SVG will be rendered here -->
            <span class="badge-symbol">✕</span>
          </div>
          <div class="turn-text-group">
            <span class="turn-label" id="turnSubtitle">Current Move</span>
            <span class="status-msg" id="statusMessage">Player 1's Turn (X)</span>
          </div>
        </div>
        <div class="thinking-spinner hidden" id="thinkingSpinner" aria-hidden="true" title="Computer is calculating...">
          <div class="spinner-ring"></div>
        </div>
      </div>
    </section>

    <!-- 3x3 Game Board -->
    <section class="board-wrapper" aria-label="Interactive Game Board">
      <div class="board-frame">
        <div 
          id="gameBoard" 
          class="board-grid" 
          role="grid" 
          aria-label="3 by 3 Tic Tac Toe Grid"
          tabindex="0"
        >
          <!-- 9 Clickable Cells -->
          <button type="button" class="cell" data-index="0" role="gridcell" aria-label="Row 1, Column 1, Empty" tabindex="-1"></button>
          <button type="button" class="cell" data-index="1" role="gridcell" aria-label="Row 1, Column 2, Empty" tabindex="-1"></button>
          <button type="button" class="cell" data-index="2" role="gridcell" aria-label="Row 1, Column 3, Empty" tabindex="-1"></button>
          <button type="button" class="cell" data-index="3" role="gridcell" aria-label="Row 2, Column 1, Empty" tabindex="-1"></button>
          <button type="button" class="cell" data-index="4" role="gridcell" aria-label="Row 2, Column 2, Empty" tabindex="-1"></button>
          <button type="button" class="cell" data-index="5" role="gridcell" aria-label="Row 2, Column 3, Empty" tabindex="-1"></button>
          <button type="button" class="cell" data-index="6" role="gridcell" aria-label="Row 3, Column 1, Empty" tabindex="-1"></button>
          <button type="button" class="cell" data-index="7" role="gridcell" aria-label="Row 3, Column 2, Empty" tabindex="-1"></button>
          <button type="button" class="cell" data-index="8" role="gridcell" aria-label="Row 3, Column 3, Empty" tabindex="-1"></button>
        </div>

        <!-- Strike line canvas/overlay for winning combination -->
        <svg id="winningLineSvg" class="winning-line-svg hidden" aria-hidden="true" viewBox="0 0 300 300">
          <line id="winningLine" x1="0" y1="0" x2="0" y2="0" stroke="currentColor" stroke-width="8" stroke-linecap="round" />
        </svg>
      </div>
    </section>

    <!-- Scoreboard Panel -->
    <section class="scoreboard-section" aria-label="Match Scoreboard">
      <div class="scoreboard-grid">
        <!-- Player X Card -->
        <div class="score-card score-x" id="scoreCardX">
          <div class="score-header">
            <span class="player-icon x-icon" aria-hidden="true">✕</span>
            <span class="player-name" id="playerXName">Player 1 (X)</span>
          </div>
          <div class="score-value" id="scoreX">0</div>
        </div>

        <!-- Draws Card -->
        <div class="score-card score-draw" id="scoreCardDraw">
          <div class="score-header">
            <span class="player-icon draw-icon" aria-hidden="true">═</span>
            <span class="player-name">Ties</span>
          </div>
          <div class="score-value" id="scoreDraw">0</div>
        </div>

        <!-- Player O / Computer Card -->
        <div class="score-card score-o" id="scoreCardO">
          <div class="score-header">
            <span class="player-icon o-icon" aria-hidden="true">○</span>
            <span class="player-name" id="playerOName">Player 2 (O)</span>
          </div>
          <div class="score-value" id="scoreO">0</div>
        </div>
      </div>
    </section>

    <!-- Game Action Controls -->
    <section class="controls-section" aria-label="Game Controls">
      <div class="controls-row primary-controls">
        <button type="button" id="restartRoundBtn" class="action-btn btn-secondary" title="Restart current round without clearing scores">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 4v6h6"></path>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          <span>Restart Round</span>
        </button>

        <button type="button" id="newGameBtn" class="action-btn btn-primary" title="Clear board and start a fresh game">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span>New Game</span>
        </button>
      </div>

      <div class="controls-row secondary-controls">
        <button type="button" id="resetScoreBtn" class="utility-btn btn-outline" title="Reset all match scores to zero">
          <svg class="btn-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Reset Scores</span>
        </button>

        <button type="button" id="soundToggleBtn" class="utility-btn btn-outline" title="Toggle audio sound effects" aria-label="Toggle Sound Effects" aria-pressed="true">
          <svg id="soundIconOn" class="btn-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="soundIconOff" class="btn-icon-sm hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
            <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
          <span id="soundLabel">Sound: On</span>
        </button>
      </div>
    </section>

    <!-- Footer -->
    <footer class="game-footer">
      <p class="footer-text">Made for fun · Modern Tic Tac Toe</p>
    </footer>
  </main>

  <!-- Accessible Modal Dialog for Score Reset Confirmation -->
  <div id="confirmModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc">
    <div class="modal-card">
      <div class="modal-icon-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h2 id="modalTitle" class="modal-title">Reset Scoreboard?</h2>
      <p id="modalDesc" class="modal-desc">This will erase all win and draw statistics for this session. This action cannot be undone.</p>
      <div class="modal-actions">
        <button type="button" id="cancelResetBtn" class="modal-btn btn-ghost">Cancel</button>
        <button type="button" id="confirmResetBtn" class="modal-btn btn-danger">Yes, Reset Scores</button>
      </div>
    </div>
  </div>

  <!-- Win Announcement Toast Notification / Confetti Canvas -->
  <canvas id="fxCanvas" class="fx-canvas" aria-hidden="true"></canvas>

  <script src="script.js"></script>
</body>
</html>
